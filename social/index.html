<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XSTREAM SOCIAL — La comunidad audiovisual</title>
<meta name="description" content="XSTREAM SOCIAL: publica, comenta, sigue y vive la comunidad de películas, series y anime de XSTREAM.">
<link rel="icon" href="/icon.svg">
<script>
  /* local (file://) usa rutas relativas · web usa absolutas */
  if (location.protocol === 'file:') {
    document.write('<link rel="stylesheet" href="social.css">');
  } else {
    document.write('<link rel="stylesheet" href="/social/social.css">');
  }
</script>
</head>
<body>
<div class="soc-app">

  <!-- ══════════ TOPBAR ══════════ -->
  <header class="soc-top">
    <a class="soc-brand" href="../" data-main="" title="Ir a XSTREAM">
      <span class="soc-logo">X</span>
      <span class="soc-brandname">XSTREAM<b>SOCIAL</b></span>
    </a>
    <div class="soc-search" id="socSearchWrap">
      <span class="soc-search-ic">🔍</span>
      <input id="socSearch" type="text" placeholder="Buscar películas, series, personas, grupos..." autocomplete="off" spellcheck="false">
      <div class="soc-search-drop hidden" id="socSearchDrop"></div>
    </div>
    <nav class="soc-topnav">
      <a href="../" data-main="" title="Catálogo de películas en XSTREAM">Películas</a>
      <a href="../" data-main="" title="Series en XSTREAM">Series</a>
      <a href="../" data-main="" title="Anime en XSTREAM">Anime</a>
      <a href="./" class="on" title="Estás en la comunidad">Comunidad</a>
    </nav>
    <div class="soc-top-actions">
      <button class="soc-bell" id="socBell" title="Notificaciones">
        <span>🔔</span><b class="soc-badge" id="socBellCount" hidden>0</b>
        <div class="soc-notif-drop hidden" id="socNotifDrop"></div>
      </button>
      <button class="soc-bell" id="socMsgBtn" title="Mensajes">
        <span>💬</span><b class="soc-badge" id="socMsgCount" hidden>0</b>
      </button>
      <button class="soc-bell" id="socThemeBtn" title="Cambiar tema claro/oscuro">🌙</button>
      <div class="soc-me" id="socMe">
        <span class="soc-avatar" id="socMeAvatar">?</span>
        <span class="soc-me-txt">
          <b id="socMeName">Cargando…</b>
          <small><i class="soc-dot on"></i> En línea</small>
        </span>
        <span class="soc-caret">▾</span>
        <div class="soc-me-drop hidden" id="socMeDrop"></div>
      </div>
    </div>
  </header>

  <!-- ══════════ RAIL IZQUIERDO — contraído: solo iconos ══════════ -->
  <aside class="soc-side" id="socSide">
    <nav class="soc-side-nav" id="socSideNav">
      <a class="on" data-nav="inicio" title="Inicio"><span>🏠</span></a>
      <a data-nav="explorar" title="Explorar"><span>🧭</span></a>
      <a data-nav="foro" title="Foro"><span>🧵</span></a>
      <a data-nav="amigos" title="Amigos"><span>👥</span></a>
      <a data-nav="grupos" title="Grupos"><span>⬡</span></a>
      <a data-nav="mensajes" title="Mensajes"><span>💬</span><b class="soc-red hidden" id="socSideMsg"></b></a>
      <a data-nav="notificaciones" title="Notificaciones"><span>🔔</span><b class="soc-red hidden" id="socSideNotif"></b></a>
      <a data-nav="perfil" title="Mi perfil"><span>🧑</span></a>
    </nav>
  </aside>

  <!-- ══════════ COLUMNA CENTRAL ══════════ -->
  <main class="soc-main">

    <!-- Publicar -->
    <section class="soc-card soc-create">
      <span class="soc-avatar me" id="socCreateAvatar">?</span>
      <div class="soc-create-body">
        <textarea id="socPostText" rows="2" placeholder="¿Qué estás pensando?" maxlength="800"></textarea>
        <div class="soc-attach hidden" id="socAttach"></div>
        <div class="soc-tools">
          <button class="soc-tool" data-tool="foto" title="Añadir foto o vídeo (URL o del catálogo)">📷 Foto/Vídeo</button>
          <button class="soc-tool" data-tool="encuesta" title="Crear una encuesta">📊 Encuesta</button>
          <button class="soc-tool" data-tool="enlace" title="Añadir un enlace">🔗 Enlace</button>
          <button class="soc-tool" data-tool="gif" title="Añadir un GIF o imagen por URL">🎞 GIF</button>
          <button class="soc-btn soc-btn-green" id="socPublish">Publicar</button>
        </div>
      </div>
    </section>

    <!-- Historias -->
    <section class="soc-card soc-stories-card">
      <div class="soc-stories" id="socStories"></div>
    </section>

    <!-- Feed -->
    <section id="socFeed" class="soc-feed" aria-live="polite"></section>
    <div class="soc-feed-empty hidden" id="socFeedEmpty"></div>
  </main>

  <!-- ══════════ COLUMNA IZQUIERDA INTERNA: TENDENCIAS + GRUPOS ══════════ -->
  <aside class="soc-col-left">
    <section class="soc-card">
      <div class="soc-card-h"><span>🔥 Tendencias ahora</span><small># de la comunidad</small></div>
      <div class="soc-trends" id="socTrends"></div>
    </section>
    <section class="soc-card">
      <div class="soc-card-h"><span>⬡ Grupos recomendados</span></div>
      <div class="soc-groups" id="socGroups"></div>
    </section>
  </aside>

  <!-- ══════════ SOCIAL DOCK — la columna derecha unificada: pestañas
       que cambian al instante (Chat · Descubre · Vivo). Sin cabecera
       (todo el espacio arriba para las pestañas) y sin pie promo   ══════════ -->
  <aside class="soc-dock" id="socDock">
    <nav class="soc-dock-tabs" id="socDockTabs">
      <button class="on" data-t="foro"><span>🧵</span> Foro</button>
      <button data-t="descubre"><span>✨</span> Descubre</button>
      <button data-t="vivo"><span>🔴</span> Vivo</button>
    </nav>
    <div class="soc-dock-body">
      <section class="soc-dock-tab on" data-tb="foro">
        <div class="foro-bg" id="foroBg"></div>
        <div class="soc-foro-card" id="foroRoot">
          <div class="foro-top">
            <b class="foro-brand">🧵 FORO <i>XSTREAM</i></b>
            <span class="foro-toolbar">
              <button class="foro-tool" id="foroSeed" title="🤖 Agente: crear automáticamente los temas del catálogo (solo admin)">🤖<small>Temas</small></button>
              <button class="foro-tool" id="foroBgBtn" title="🖼 Fondo del foro — sube TU imagen (local en tu dispositivo)">🖼<small>Fondo</small></button>
              <button class="foro-tool foro-tool-main" id="foroNew" title="Crear un tema nuevo">＋<small>Tema</small></button>
            </span>
          </div>
          <div class="foro-crumb hidden" id="foroCrumb"></div>
          <!-- forobeta: HOME (boards verticales) · BOARD (hilos) · HILO -->
          <div class="foro-view" id="foroHome"></div>
          <div class="foro-view hidden" id="foroBoard"></div>
          <div class="foro-view hidden" id="foroThread"></div>
        </div>
      </section>
      <section class="soc-dock-tab" data-tb="descubre">
        <div class="soc-card">
          <div class="soc-card-h"><span>👑 Contenido destacado</span><a href="../" data-main="" id="socFeatAll">Ver todo →</a></div>
          <div class="soc-feat" id="socFeat"></div>
          <div class="soc-feat-nav" id="socFeatNav"></div>
        </div>
        <div class="soc-card">
          <div class="soc-card-h"><span>👥 Personas que quizás conozcas</span></div>
          <div class="soc-suggest" id="socSuggest"></div>
        </div>
      </section>
      <section class="soc-dock-tab" data-tb="vivo">
        <div class="soc-card">
          <div class="soc-card-h"><span>🔴 Eventos en vivo</span></div>
          <div class="soc-live" id="socLive"></div>
        </div>
        <div class="soc-card">
          <div class="soc-card-h"><span>🟢 Usuarios en línea</span><a href="javascript:void 0" id="socOnlineMore">Ver más →</a></div>
          <div class="soc-online" id="socOnline"></div>
        </div>
      </section>
    </div>
  </aside>

</div>

<!-- Vistas superpuestas: perfil, conversación, publicar detalle -->
<div class="soc-overlay hidden" id="socOverlay"><div class="soc-sheet" id="socSheet"></div></div>

<!-- Navegación móvil -->
<nav class="soc-mob" id="socMob">
  <a data-nav="inicio" class="on">🏠</a>
  <a data-nav="explorar">🧭</a>
  <a data-nav="foro">🧵</a>
  <a data-nav="amigos">👥</a>
  <a data-nav="grupos">⬡</a>
  <a data-nav="mensajes">💬<b class="soc-red hidden" id="socMobMsg"></b></a>
  <a data-nav="notificaciones">🔔<b class="soc-red hidden" id="socMobNotif"></b></a>
  <a data-nav="perfil">🧑</a>
</nav>

<div class="soc-toasts" id="socToasts"></div>

<!-- la lista de conversaciones (DMs) vive oculta aquí: el botón 💬 del
     topbar la abre en un sheet — el dock es del FORO ahora -->
<div class="hidden" id="socConvosWrap"><div class="soc-convos" id="socConvos"></div></div>

<script>
  if (location.protocol === 'file:') {
    document.write('<script src="../auth.js"><\/script><script src="social.js"><\/script>');
  } else {
    document.write('<script src="/auth.js"><\/script><script src="/social/social.js"><\/script>');
  }
</script>
</body>
</html>

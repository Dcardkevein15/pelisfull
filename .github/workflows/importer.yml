name: X-STREAM Importador en la nube

# ☁ Procesa la cola de importación (import-queue.json, rama chat-data)
# leyendo Google Drive DIRECTO desde los servidores de GitHub — sin proxies,
# sin CORS, sin navegador. Sigue corriendo aunque cierres el celular.
# Reintenta los fallidos con backoff 2m→5m→15m→1h→4h→24h (máx 6 intentos).

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/2 * * * *'   # reintentos cada 2 minutos (sale al instante si no hay nada)

permissions:
  contents: write

concurrency:
  group: importer-cloud
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'Dcardkevein15/pelisfull'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Procesar cola de importacion
        run: node .github/scripts/importer.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
